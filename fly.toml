# Fly.io: `fly launch --copy-config --no-deploy`, then
#   fly volumes create lumen_data --size 1
#   fly secrets set GROQ_API_KEY=... [FISH_API_KEY=... FISH_VOICE_ID=...]
#   fly deploy
app = "lumen-learn"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[[mounts]]
  source = "lumen_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "4s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
