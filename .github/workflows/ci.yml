name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: OCR and PDF tools (for the upload journeys)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils ffmpeg espeak-ng
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser smoke test
        run: |
          npx vite --port 5173 --strictPort &
          npx wait-on -t 60000 http://localhost:5173
          CHROME_PATH="$(which google-chrome || which chromium-browser)" npm run smoke -- http://localhost:5173 smoke-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-shots/
          if-no-files-found: ignore
