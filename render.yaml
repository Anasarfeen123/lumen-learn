# Render Blueprint (free plan): New → Blueprint → pick this repo, then paste the
# values it asks for. Accounts live in Turso's free hosted database, because
# Render's free plan has no disk (see README → Deploy).
services:
  - type: web
    name: lumen-learn
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FISH_API_KEY
        sync: false
